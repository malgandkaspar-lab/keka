# Complete stack with FREE local AI (no API costs):
#   docker compose up --build
# then open http://localhost:3000 and create the admin account.
# Text generation runs in the `ollama` service (the model is pulled automatically on
# first start); voice (Kokoro) and subtitles (Parakeet) run inside the worker and
# download their models automatically on first use.
name: shorts-factory

x-app: &app
  build: .
  image: shorts-factory:latest
  env_file: .env
  environment:
    DATABASE_URL: postgresql://shorts:${POSTGRES_PASSWORD:-shorts}@postgres:5432/shorts_factory
    REDIS_URL: redis://redis:6379
    OLLAMA_BASE_URL: http://ollama:11434
    STORAGE_LOCAL_DIR: /app/storage
    WORK_DIR: /app/storage/tmp
    LOCAL_MODELS_DIR: /app/storage/models
  volumes:
    - media:/app/storage
  restart: unless-stopped

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: shorts
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-shorts}
      POSTGRES_DB: shorts_factory
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shorts -d shorts_factory"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    # AOF persistence so queued jobs survive Redis restarts; BullMQ requires noeviction.
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec", "--maxmemory-policy", "noeviction"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama:/root/.ollama
    restart: unless-stopped
    # With an NVIDIA GPU (much faster), uncomment:
    # deploy:
    #   resources:
    #     reservations:
    #       devices: [{ driver: nvidia, count: all, capabilities: [gpu] }]

  ollama-pull:
    image: ollama/ollama:latest
    entrypoint: ["/bin/sh", "-c"]
    command: ["sleep 3 && ollama pull ${OLLAMA_MODEL:-qwen2.5:7b}"]
    environment:
      OLLAMA_HOST: http://ollama:11434
    depends_on:
      - ollama
    restart: "no"

  migrate:
    <<: *app
    command: ["migrate"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  app:
    <<: *app
    command: ["web"]
    ports:
      - "${APP_PORT:-3000}:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5

  worker:
    <<: *app
    command: ["worker"]
    environment:
      DATABASE_URL: postgresql://shorts:${POSTGRES_PASSWORD:-shorts}@postgres:5432/shorts_factory
      REDIS_URL: redis://redis:6379
      OLLAMA_BASE_URL: http://ollama:11434
      STORAGE_LOCAL_DIR: /app/storage
      WORK_DIR: /app/storage/tmp
      LOCAL_MODELS_DIR: /app/storage/models
      SERVICE_NAME: shorts-factory-worker
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    stop_grace_period: 2m

volumes:
  pgdata:
  redisdata:
  media:
  ollama:
